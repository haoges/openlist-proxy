name: Syntax Check

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare Worker entry
        run: node --input-type=module --check < openlist-proxy.js
      - name: Check EdgeOne Makers adapter
        run: node --input-type=module --check < 'edge-functions/[[default]].js'
